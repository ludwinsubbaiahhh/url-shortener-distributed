version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: urldb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 3. RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 4. Our 3 Backend Services (Corrected)
  # All 3 services will build from the same backend/Dockerfile
  # but will run different commands.

  url-service:
    build: ./backend
    command: sh -c "npx -r dotenv/config prisma db push && node dist/apps/url-service/main"
    ports:
      - "3001:3001" # Main API port
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/urldb"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://admin:password@rabbitmq:5672"
      JWT_SECRET: "YOUR_SUPER_SECRET_KEY_CHANGE_THIS"
      JWT_EXPIRES_IN: "1d"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics-service:
    build: ./backend
    command: node dist/apps/analytics-service/main
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/urldb"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://admin:password@rabbitmq:5672"
    depends_on:
      - url-service # Wait for the main service (and its migration) to be up

  worker-service:
    build: ./backend
    command: node dist/apps/worker-service/main
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: "postgresql://user:password@postgres:5432/urldb"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://admin:password@rabbitmq:5672"
    depends_on:
      - url-service

  # 5. Our Frontend
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:80" # Connect to Nginx

  # 6. Nginx API Gateway
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - url-service
      - frontend

volumes:
  postgres_data:
  redis_data:
